name: Build Cross-Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install AppImageTool
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Upload Linux Asset
        uses: softprops/action-gh-release@v1
        with:
          files: Open-Multi-Earbud-Hub-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Open-Multi-Earbud-Hub" --add-data "src;src" --add-data "assets;assets" run.py
          Compress-Archive -Path dist/Open-Multi-Earbud-Hub/* -DestinationPath Open-Multi-Earbud-Hub-Windows.zip

      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v1
        with:
          files: Open-Multi-Earbud-Hub-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Open-Multi-Earbud-Hub" --add-data "src:src" --add-data "assets:assets" run.py
          cd dist
          zip -r ../Open-Multi-Earbud-Hub-macOS.zip Open-Multi-Earbud-Hub.app

      - name: Upload macOS Asset
        uses: softprops/action-gh-release@v1
        with:
          files: Open-Multi-Earbud-Hub-macOS.zip
