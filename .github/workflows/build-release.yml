name: Build Cross-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System C/D-Bus Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config zip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Open-Multi-Earbud-Hub" --add-data "src:src" --add-data "assets:assets" run.py
          cd dist
          zip -r ../Open-Multi-Earbud-Hub-Linux.zip Open-Multi-Earbud-Hub

      - name: Upload Linux Asset
        uses: softprops/action-gh-release@v2
        with:
          files: Open-Multi-Earbud-Hub-Linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Open-Multi-Earbud-Hub" --add-data "src;src" --add-data "assets;assets" run.py
          Compress-Archive -Path dist/Open-Multi-Earbud-Hub/* -DestinationPath Open-Multi-Earbud-Hub-Windows.zip

      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v2
        with:
          files: Open-Multi-Earbud-Hub-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Open-Multi-Earbud-Hub" --add-data "src:src" --add-data "assets:assets" run.py
          cd dist
          zip -r ../Open-Multi-Earbud-Hub-macOS.zip Open-Multi-Earbud-Hub.app

      - name: Upload macOS Asset
        uses: softprops/action-gh-release@v2
        with:
          files: Open-Multi-Earbud-Hub-macOS.zip